rang\"\u003e\r\n  \u003cdiv class=\"cv-container\"\u003e\r\n    \u003csection class=\"cv-hero\"\u003e\r\n      \u003cdiv\u003e\r\n        \u003cdiv class=\"cv-tag\"\u003eSinh viên Kinh tế số | Ứng tuyển thực tập\u003c/div\u003e\r\n\r\n        \u003ch1\u003eNgô Quỳnh Trang\u003c/h1\u003e\r\n\r\n        \u003cp class=\"cv-lead\"\u003e\r\n          Sinh viên chuyên ngành Kinh tế số tại Trường Đại học Kinh tế Huế. Tôi đang tìm kiếm cơ hội thực tập tại công ty/doanh nghiệp để học hỏi môi trường làm việc thực tế, phát triển kỹ năng chuyên môn và đóng góp bằng tinh thần trách nhiệm, chủ động, tích cực.\r\n        \u003c/p\u003e\r\n\r\n        \u003cdiv class=\"cv-info\"\u003e\r\n          \u003cp\u003e\u003cstrong\u003eHọ tên:\u003c/strong\u003e Ngô Quỳnh Trang\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eNgày sinh:\u003c/strong\u003e 28/08/2005\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eGiới tính:\u003c/strong\u003e Nữ\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eVị trí mong muốn:\u003c/strong\u003e Thực tập sinh Kinh tế số / Kinh doanh / Vận hành / Chăm sóc khách hàng\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịa chỉ:\u003c/strong\u003e Ngự Bình, Phường An Cựu, TP Huế\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-buttons\"\u003e\r\n          \u003ca href=\"#cv-experience\" class=\"cv-btn cv-btn-primary\"\u003eXem kinh nghiệm\u003c/a\u003e\r\n          \u003ca href=\"mailto:nqtrang2808@gmail.com\" class=\"cv-btn cv-btn-outline\"\u003eGửi email\u003c/a\u003e\r\n          \u003ca href=\"LINK_FILE_PDF_CANVA\" target=\"_blank\" class=\"cv-btn cv-btn-outline\"\u003eXem CV PDF\u003c/a\u003e\r\n        \u003c/div\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003cdiv class=\"cv-photo\"\u003e\r\n        \u003cimg src=\"https://res.cloudinary.com/dojibbcof/image/upload/v1779867230/683352633_2376554676091479_8480479538431842633_n_w91sd5.jpg\"\r\n        alt=\"Ngô Quỳnh Trang\"\u003e\r\n      \u003c/div\u003e\r\n      \u003c/div\u003e\r\n    \u003c/section\u003e\r\n\r\n    \u003csection class=\"cv-section\"\u003e\r\n      \u003ch2 class=\"cv-title\"\u003eWhat I Do\u003c/h2\u003e\r\n      \u003cp class=\"cv-desc\"\u003e\r\n        Các định hướng công việc phù hợp với kinh nghiệm hiện tại, kỹ năng dịch vụ và chuyên ngành Kinh tế số của tôi.\r\n      \u003c/p\u003e\r\n\r\n      \u003cdiv class=\"cv-grid-3\"\u003e\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003cdiv class=\"cv-icon\"\u003e✦\u003c/div\u003e\r\n          \u003ch3\u003eChăm sóc khách hàng\u003c/h3\u003e\r\n          \u003cp\u003eGiao tiếp thân thiện, hỗ trợ khách hàng trong quá trình sử dụng dịch vụ, tư vấn sản phẩm và xử lý tình huống phát sinh linh hoạt.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003cdiv class=\"cv-icon\"\u003e✧\u003c/div\u003e\r\n          \u003ch3\u003eVận hành dịch vụ\u003c/h3\u003e\r\n          \u003cp\u003eQuen với môi trường làm việc có cường độ cao, biết phối hợp với các bộ phận, đảm bảo quy trình phục vụ và vệ sinh khu vực làm việc.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003cdiv class=\"cv-icon\"\u003e✺\u003c/div\u003e\r\n          \u003ch3\u003eKinh doanh số\u003c/h3\u003e\r\n          \u003cp\u003eMong muốn học hỏi thêm về ứng dụng công nghệ, dữ liệu và nền tảng số trong hoạt động kinh doanh, bán hàng và quản lý doanh nghiệp.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n      \u003c/div\u003e\r\n    \u003c/section\u003e\r\n\r\n    \u003csection class=\"cv-section\"\u003e\r\n      \u003ch2 class=\"cv-title\"\u003eSelected Skills\u003c/h2\u003e\r\n      \u003cp class=\"cv-desc\"\u003eNhững kỹ năng được tích lũy qua quá trình học tập và làm việc thực tế.\u003c/p\u003e\r\n\r\n      \u003cdiv class=\"cv-grid-3\"\u003e\r\n        \u003cdiv class=\"cv-card cv-skill\"\u003e\r\n          \u003ch3\u003ePOS \u0026 Thu ngân\u003c/h3\u003  38px rgba(53, 69, 94, 0.08);\r\n    transition: 0.25s;\r\n  }\r\n\r\n  #cv-trang .cv-card:hover {\r\n    transform: translateY(-6px);\r\n    box-shadow: 0 24px 48px rgba(53, 69, 94, 0.12);\r\n  }\r\n\r\n  #cv-trang .cv-icon {\r\n    color: #7892ec;\r\n    font-size: 34px;\r\n    margin-bottom: 14px;\r\n  }\r\n\r\n  #cv-trang .cv-card h3 {\r\n    color: #465266;\r\n    font-size: 25px;\r\n    margin: 0 0 12px;\r\n    line-height: 1.25;\r\n  }\r\n\r\n  #cv-trang .cv-card p {\r\n    font-size: 17px;\r\n    margin: 0;\r\n  }\r\n\r\n  #cv-trang .cv-skill {\r\n    border-left: 5px solid #7892ec;\r\n  }\r\n\r\n  #cv-trang .cv-experience {\r\n    background: rgba(255, 255, 255, 0.78);\r\n    border-radius: 24px;\r\n    padding: 28px;\r\n    box-shadow: 0 18px 38px rgba(53, 69, 94, 0.08);\r\n  }\r\n\r\n  #cv-trang .cv-time {\r\n    color: #7892ec;\r\n    font-weight: 800;\r\n    font-size: 17px;\r\n  }\r\n\r\n  #cv-trang .cv-experience h3 {\r\n    color: #465266;\r\n    font-size: 25px;\r\n    margin: 8px 0 4px;\r\n  }\r\n\r\n  #cv-trang .cv-role {\r\n    color: #7892ec;\r\n    font-weight: 700;\r\n    margin-bottom: 14px;\r\n  }\r\n\r\n  #cv-trang .cv-experience ul {\r\n    padding-left: 20px;\r\n    margin: 0;\r\n  }\r\n\r\n  #cv-trang .cv-experience li {\r\n    margin-bottom: 8px;\r\n    font-size: 16.5px;\r\n  }\r\n\r\n  #cv-trang .cv-about {\r\n    display: grid;\r\n    grid-template-columns: 1fr 1fr;\r\n    gap: 26px;\r\n  }\r\n\r\n  #cv-trang .cv-contact {\r\n    background: #e4ebf4;\r\n    border-radius: 34px;\r\n    padding: 50px;\r\n    box-shadow: 0 20px 45px rgba(53, 69, 94, 0.08);\r\n  }\r\n\r\n  #cv-trang .cv-contact-grid {\r\n    display: grid;\r\n    grid-template-columns: repeat(3, 1fr);\r\n    gap: 22px;\r\n    margin-top: 28px;\r\n  }\r\n\r\n  #cv-trang .cv-contact-box {\r\n    background: rgba(255, 255, 255, 0.78);\r\n    border-radius: 20px;\r\n    padding: 24px;\r\n  }\r\n\r\n  #cv-trang .cv-contact-box h3 {\r\n    color: #7892ec;\r\n    margin: 0 0 8px;\r\n  }\r\n\r\n  #cv-trang .cv-footer {\r\n    text-align: center;\r\n    padding: 30px 0 45px;\r\n    color: #7b8796;\r\n  }\r\n\r\n  @media (max-width: 900px) {\r\n    #cv-trang .cv-hero,\r\n    #cv-trang .cv-grid-3,\r\n    #cv-trang .cv-grid-2,\r\n    #cv-trang .cv-about,\r\n    #cv-trang .cv-contact-grid {\r\n      grid-template-columns: 1fr;\r\n    }\r\n\r\n    #cv-trang .cv-photo {\r\n      min-height: 360px;\r\n    }\r\n\r\n    #cv-trang .cv-section {\r\n      padding: 60px 0;\r\n    }\r\n\r\n    #cv-trang .cv-contact {\r\n      padding: 32px;\r\n    }\r\n  }\r\n\r\n  @media (max-width: 520px) {\r\n    #cv-trang h1,\r\n    #cv-trang .cv-title {\r\n      font-size: 42px;\r\n    }\r\n\r\n    #cv-trang .cv-lead,\r\n    #cv-trang .cv-desc {\r\n      font-size: 17px;\r\n    }\r\n  }\r\n\u003c/style\u003e\r\n\r\n\u003cdiv id=\"cv-trang\"\u003e\r\n  \u003cdiv class=\"cv-container\"\u003e\r\n    \u003csection class=\"cv-hero\"\u003e\r\n      \u003cdiv\u003e\r\n        \u003cdiv class=\"cv-tag\"\u003eSinh viên Kinh tế số | Ứng tuyển thực tập\u003c/div\u003e\r\n\r\n        \u003ch1\u003eNgô Quỳnh Trang\u003c/h1\u003e\r\n\r\n        \u003cp class=\"cv-lead\"\u003e\r\n          Sinh viên chuyên ngành Kinh tế số tại Trường Đại học Kinh tế Huế. Tôi đang tìm kiếm cơ hội thực tập tại công ty/doanh nghiệp để học hỏi môi trường làm việc thực tế, phát triển kỹ năng chuyên môn và đóng góp bằng tinh thần trách nhiệm, chủ động, tích cực.\r\n        \u003c/p\u003e\r\n\r\n        \u003cdiv class=\"cv-info\"\u003e\r\n          \u003cp\u003e\u003cstrong\u003eHọ tên:\u003c/strong\u003e Ngô Quỳnh Trang\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eNgày sinh:\u003c/strong\u003e 28/08/2005\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eGiới tính:\u003c/strong\u003e Nữ\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eVị trí mong muốn:\u003c/strong\u003e Thực tập sinh Kinh tế số / Kinh doanh / Vận hành / Chăm sóc khách hàng\u003c/p\u003e\r\n          \u003cp\u003e\u003cstrong\u003eĐịa chỉ:\u003c/strong\u003e Ngự Bình, Phường An Cựu, TP Huế\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-buttons\"\u003e\r\n          \u003ca href=\"#cv-experience\" class=\"cv-btn cv-btn-primary\"\u003eXem kinh nghiệm\u003c/a\u003e\r\n          \u003ca href=\"mailto:nqtrang2808@gmail.com\" class=\"cv-btn cv-btn-outline\"\u003eGửi email\u003c/a\u003e\r\n          \u003ca href=\"LINK_FILE_PDF_CANVA\" target=\"_blank\" class=\"cv-btn cv-btn-outline\"\u003eXem CV PDF\u003c/a\u003e\r\n        \u003c/div\u003e\r\n      \u003c/div\u003e\r\n\r\n      \u003cdiv class=\"cv-photo\"\u003e\r\n        \u003cimg src=\"https://res.cloudinary.com/dojibbcof/image/upload/v1779867230/683352633_2376554676091479_8480479538431842633_n_w91sd5.jpg\"\r\n        alt=\"Ngô Quỳnh Trang\"\u003e\r\n      \u003c/div\u003e\r\n      \u003c/div\u003e\r\n    \u003c/section\u003e\r\n\r\n    \u003csection class=\"cv-section\"\u003e\r\n      \u003ch2 class=\"cv-title\"\u003eWhat I Do\u003c/h2\u003e\r\n      \u003cp class=\"cv-desc\"\u003e\r\n        Các định hướng công việc phù hợp với kinh nghiệm hiện tại, kỹ năng dịch vụ và chuyên ngành Kinh tế số của tôi.\r\n      \u003c/p\u003e\r\n\r\n      \u003cdiv class=\"cv-grid-3\"\u003e\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003cdiv class=\"cv-icon\"\u003e✦\u003c/div\u003e\r\n          \u003ch3\u003eChăm sóc khách hàng\u003c/h3\u003e\r\n          \u003cp\u003eGiao tiếp thân thiện, hỗ trợ khách hàng trong quá trình sử dụng dịch vụ, tư vấn sản phẩm và xử lý tình huống phát sinh linh hoạt.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003cdiv class=\"cv-icon\"\u003e✧\u003c/div\u003e\r\n          \u003ch3\u003eVận hành dịch vụ\u003c/h3\u003e\r\n          \u003cp\u003eQuen với môi trường làm việc có cường độ cao, biết phối hợp với các bộ phận, đảm bảo quy trình phục vụ và vệ sinh khu vực làm việc.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003cdiv class=\"cv-icon\"\u003e✺\u003c/div\u003e\r\n          \u003ch3\u003eKinh doanh số\u003c/h3\u003e\r\n          \u003cp\u003eMong muốn học hỏi thêm về ứng dụng công nghệ, dữ liệu và nền tảng số trong hoạt động kinh doanh, bán hàng và quản lý doanh nghiệp.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n      \u003c/div\u003e\r\n    \u003c/section\u003e\r\n\r\n    \u003csection class=\"cv-section\"\u003e\r\n      \u003ch2 class=\"cv-title\"\u003eSelected Skills\u003c/h2\u003e\r\n      \u003cp class=\"cv-desc\"\u003eNhững kỹ năng được tích lũy qua quá trình học tập và làm việc thực tế.\u003c/p\u003e\r\n\r\n      \u003cdiv class=\"cv-grid-3\"\u003e\r\n        \u003cdiv class=\"cv-card cv-skill\"\u003e\r\n          \u003ch3\u003ePOS \u0026 Thu ngân\u003c/h3\u003e\r\n          \u003cp\u003eThành thạo thao tác POS, thanh toán, giới thiệu combo, kiểm tra và hỗ trợ kiểm kê hàng hóa cuối ngày.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card cv-skill\"\u003e\r\n          \u003ch3\u003ePhục vụ khách hàng\u003c/h3\u003e\r\n          \u003cp\u003eBiết hướng dẫn khách order, sử dụng dịch vụ, tư vấn sản phẩm và giữ thái độ tích cực trong quá trình làm việc.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card cv-skill\"\u003e\r\n          \u003ch3\u003eLàm việc áp lực cao\u003c/h3\u003e\r\n          \u003cp\u003eCó kinh nghiệm làm việc trong môi trường đông khách, nhịp độ nhanh, yêu cầu xử lý công việc liên tục.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card cv-skill\"\u003e\r\n          \u003ch3\u003eChuẩn bị nguyên liệu\u003c/h3\u003e\r\n          \u003cp\u003eChủ động chuẩn bị coffee, trà sữa, kem muối, sương sáo, các loại trà và nguyên liệu phục vụ pha chế.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card cv-skill\"\u003e\r\n          \u003ch3\u003eLàm việc nhóm\u003c/h3\u003e\r\n          \u003cp\u003ePhối hợp tốt với đồng nghiệp, hỗ trợ các khu vực khác sau khi hoàn thành công việc được phân công.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card cv-skill\"\u003e\r\n          \u003ch3\u003eBáo cáo \u0026 tính toán\u003c/h3\u003e\r\n          \u003cp\u003eCó khả năng hỗ trợ tính công, tính lương, tổng hợp số liệu và báo cáo doanh thu theo yêu cầu được giao.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n      \u003c/div\u003e\r\n    \u003c/section\u003e\r\n\r\n    \u003csection class=\"cv-section\"\u003e\r\n      \u003ch2 class=\"cv-title\"\u003eMore about me\u003c/h2\u003e\r\n      \u003cp class=\"cv-desc\"\u003e\r\n        Tôi là người có tinh thần học hỏi, chủ động trong công việc, nghiêm túc với trách nhiệm được giao và luôn cố gắng hoàn thiện bản thân qua từng trải nghiệm thực tế.\r\n      \u003c/p\u003e\r\n\r\n      \u003cdiv class=\"cv-about\"\u003e\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003ch3\u003eHọc vấn\u003c/h3\u003e\r\n          \u003cp\u003e\u003cstrong\u003e2023 - nay:\u003c/strong\u003e Trường Đại học Kinh tế Huế — Chuyên ngành Kinh tế số.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003ch3\u003eMục tiêu thực tập\u003c/h3\u003e\r\n          \u003cp\u003eĐược làm việc trong môi trường doanh nghiệp chuyên nghiệp, học hỏi quy trình thực tế và áp dụng kiến thức kinh tế số vào công việc.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003ch3\u003eĐiểm mạnh\u003c/h3\u003e\r\n          \u003cp\u003eChăm chỉ, chủ động, có trách nhiệm, thích nghi nhanh, linh động thời gian làm việc và có tinh thần làm việc nhóm tốt.\u003c/p\u003e\r\n        \u003c/div\u003e\r\n\r\n        \u003cdiv class=\"cv-card\"\u003e\r\n          \u003ch3\u003eĐịnh hướng\u003c/h3\u003e\r\n          \u003cp\u003ePhát triển trong các vị trí liên quan đến kinh doanh, vận hành, chăm só
